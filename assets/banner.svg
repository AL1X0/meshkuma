    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320M900 0V320M1050 0V320"/>
  </g>

  <!-- Left emblem -->
  <g transform="translate(88, 68)">
    <rect width="184" height="184" rx="38" fill="#0f172a" stroke="url(#accentGrad)" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M92 32L144 62V122L92 152L40 122V62Z" stroke="url(#accentGrad)" stroke-width="3.5" stroke-opacity="0.7" stroke-linejoin="round"/>
    <path d="M92 32V152M40 62L144 122M144 62L40 122" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.28"/>
    <path d="M26 94H58L70 64L86 122L102 76L114 94H158" stroke="url(#pulseGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="32" r="7.5" fill="#38bdf8"/>
    <circle cx="144" cy="62" r="7.5" fill="#818cf8"/>
    <circle cx="144" cy="122" r="7.5" fill="#c084fc"/>
    <circle cx="92" cy="152" r="7.5" fill="#34d399"/>
    <circle cx="40" cy="122" r="7.5" fill="#818cf8"/>
    <circle cx="40" cy="62" r="7.5" fill="#38bdf8"/>
  </g>

  <!-- Title & subtitle -->
  <text x="320" y="132" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">MeshWatch</text>
  <text x="322" y="176" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400">Supervision Mesh P2P décentralisée sur Nostr &amp; Uptime Kuma</text>

