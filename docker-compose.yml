services:
  meshwatch:
    image: ghcr.io/al1x0/meshkuma:latest
    build: .
    container_name: meshwatch-agent
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/etc/meshwatch/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    # Si la sonde Docker ou la mise à jour en 1 clic accède à /var/run/docker.sock en mode nonroot,
    # ajoute le GID du groupe docker de l'hôte (stat -c '%g' /var/run/docker.sock) :
    # group_add:
    #   - "999"
    # Pour activer l'interface web locale (opt-in, désactivée par défaut) :
    # Décommente ports + environment ci-dessous (ne jamais exposer sur Internet sans VPN/proxy auth) :
    # ports:
    #   - "127.0.0.1:8080:8080"
    # environment:
    #   - MESHWATCH_UI_ADDR=0.0.0.0:8080
    #   - MESHWATCH_UI_TOKEN=change-moi-par-un-jeton-secret
    command: ["run", "--config", "/etc/meshwatch/config.yaml"]
