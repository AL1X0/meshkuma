    <linearGradient id="pulseGrad" x1="80" y1="160" x2="270" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#heroBg)"/>
