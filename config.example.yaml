node:
  name: "mon-homelab"
  private_key_hex: "REMPLACER_VIA_KEYGEN"
  group_psk_hex: "REMPLACER_VIA_KEYGEN"
  heartbeat_interval: 30s
  peer_timeout: 90s

logging:
  level: "info"   # debug, info, warn, error
  format: "text"  # text ou json

nostr:
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
    - "wss://relay.primal.net"

auto_mute:
  targets: ["1.1.1.1:443", "9.9.9.9:443"]

peers:
  - name: "ami-nord"
    pubkey_hex: "PUBKEY_HEX_DU_POTE"

probes:
  - id: "syno-nas"
    kind: "synology"
    interval: 60s
    host: "192.168.1.20"
    snmp_version: "2c"
    community: "public"
    max_temp_c: 55

  - id: "docker-local"
    kind: "docker"
    interval: 30s
    socket: "/var/run/docker.sock"
    containers: ["jellyfin", "traefik", "homeassistant"]

  - id: "srv-linux"
    kind: "node_exporter"
    interval: 60s
    url: "http://192.168.1.10:9100/metrics"
    max_disk_percent: 90
    max_ram_percent: 92

  - id: "srv-windows"
    kind: "windows_exporter"
    interval: 60s
    url: "http://192.168.1.15:9182/metrics"
    services: ["W32Time", "VeeamBackupSvc"]
    max_disk_percent: 90

  - id: "web-public"
    kind: "http"
    interval: 30s
    url: "https://mon-domaine.fr"
    expected_status: 200
    tls_min_days: 14

  - id: "proxmox-main"
    kind: "proxmox"
    interval: 60s
    url: "https://192.168.1.30:8006"
    token_id: "root@pam!meshwatch"
    token_secret: "REMPLACER_SECRET_PROXMOX"
    insecure_skip_verify: true
    max_cpu_percent: 90
    max_ram_percent: 90
    max_disk_percent: 90

notifications:
  ntfy:
    enabled: true
    url: "https://ntfy.sh/mon-topic-secret-meshwatch"
    token: ""
  photon_imessage:
    enabled: false
    mode: "cloud"                               # "cloud" (app.photon.codes), "proxy" (imessage-swagger.photon.codes) ou "custom"
    url: "https://api.photon.codes/v1"
    project_id: "pho_prj_REMPLACER"
    api_key: "pho_sk_REMPLACER"
    recipient: "+33600000000"
